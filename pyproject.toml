[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pocket-id-mcp"
version = "0.1.0"
description = "Bounded Pocket ID administration MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.12.0,<2.0",
  "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
]

[project.scripts]
pocket-id-mcp = "pocket_id_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_id_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Repository = "https://github.com/X1pheR/pocket-id-mcp"
Issues = "https://github.com/X1pheR/pocket-id-mcp/issues"
